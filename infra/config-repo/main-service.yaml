stats-client:
  service-id: stats-server
server:
  port: 0
  forward-headers-strategy: native
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    password: main
    url: jdbc:postgresql://localhost:7542/ewm-main
    username: main
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
