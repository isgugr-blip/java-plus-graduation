server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/comments/**,/admin/comments/**,/users/{userId}/comments/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**,/admin/categories/**,/admin/compilations/**,/users/{userId}/events/**,/events/**,/categories/**,/compilations/**
        - id: stats-server
          uri: lb://stats-server
          predicates:
            - Path=/hit,/stats

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: gateway
